<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monad-0 · Nexus Laboratory</title>
<style>
:root{color-scheme:dark;--bg:#08111b;--panel:#101e2b;--line:#284257;--ink:#e7f1f7;--muted:#91a9b8;--good:#70d6a0;--warn:#f0bd69;--accent:#71b7e6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17334a 0,#08111b 42%);color:var(--ink);font:14px/1.4 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:18px}.eyebrow{color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-size:11px}.top h1{margin:.2rem 0;font-size:30px}.muted{color:var(--muted)}button,input,select{background:#0b1723;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--accent)}.controls,.panel{background:rgba(16,30,43,.92);border:1px solid var(--line);border-radius:10px;padding:14px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.status{margin-left:auto;color:var(--good)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}.panel h2,.panel h3{margin:0 0 10px;font-size:16px}.system{min-height:270px}.system h2{display:flex;justify-content:space-between}.badge{font-size:11px;padding:3px 6px;border-radius:12px;background:#19384b;color:var(--accent)}.resources{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.resource{background:#0b1723;padding:7px;border-radius:5px}.bar{height:5px;background:#1e3342;border-radius:5px;margin-top:5px}.bar i{display:block;height:100%;background:var(--good);border-radius:5px}.kv{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}.kv b{color:var(--ink);font-weight:500}.wide{grid-column:span 2}.list{max-height:230px;overflow:auto;font-size:12px}.item{border-top:1px solid #1d3445;padding:7px 0}.item:first-child{border-top:0}.graph{font-family:ui-monospace,monospace;font-size:11px;color:#b9d8e8;white-space:pre-wrap}.danger{color:var(--warn)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.status{margin-left:0}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">Monad-0 · Nexus Laboratory</div><h1>Epistemic Mirror</h1><div class="muted">Four architectures. One seeded world. Watch the loop become legible.</div></div><div id="clock" class="muted">tick 0</div></header>
<section class="controls"><label>Seed <input id="seed" type="number" value="0" min="0" step="1"></label><button onclick="control('reset')">New run</button><button onclick="control('start')">Start</button><button onclick="control('pause')">Pause</button><button onclick="control('step')">Step</button><button onclick="archive()">Archive run</button><label>Speed <input id="speed" type="range" min=".1" max="20" step=".1" value="1" oninput="speed(this.value)"></label><span id="runstatus" class="status">paused</span></section>
<section id="systems" class="grid"></section>
<section class="grid"><div class="panel wide"><h2>Monad-0 hypotheses and causal graph</h2><div id="hypotheses" class="list"></div><pre id="graph" class="graph"></pre></div><div class="panel wide"><h2>Intervention contracts</h2><div id="contracts" class="list"></div></div></section>
<section class="panel" style="margin-top:12px"><h2>Replay archived telemetry</h2><select id="archives"></select><button onclick="replay()">Load replay</button><span id="replaystatus" class="muted"></span></section>
</main><script>
let state=null, timer=null;
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'/api':'/monad0-lab-api';
async function api(path,body){const r=await fetch(API_BASE+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});return r.json()}
function control(action){api('/api/control',{action,seed:+document.querySelector('#seed').value}).then(render)}
function speed(value){api('/api/control',{action:'speed',value:+value}).then(render)}
function perturb(system,type){api('/api/perturb',{system,type,duration:10}).then(render)}
function contract(system,action){let value=action==='modify'?prompt('New maintenance_priority value (0–1):','0.5'):undefined;api('/api/contract',{system,action,value:value===null?undefined:+value}).then(render)}
function archive(){api('/api/archive',{}).then(x=>{document.querySelector('#replaystatus').textContent='archived '+x.archive;loadArchives()})}
function loadArchives(){api('/api/archives').then(x=>{document.querySelector('#archives').innerHTML=x.archives.map(a=>`<option>${a}</option>`).join('')})}
function replay(){const n=document.querySelector('#archives').value;fetch(API_BASE+'/replay?name='+encodeURIComponent(n)).then(r=>r.json()).then(x=>{document.querySelector('#replaystatus').textContent='loaded '+x.tick+' ticks from '+n;const names=Object.keys(x.systems||{});if(names.length){const last=x.systems[names[0]].filter(e=>e.type==='telemetry').slice(-1)[0];document.querySelector('#graph').textContent='REPLAY · '+n+'\n\n'+JSON.stringify(last||x.systems[names[0]].slice(-1)[0],null,2)}})}
function render(s){if(!s||s.error)return;state=s;document.querySelector('#clock').textContent='tick '+s.tick+' · seed '+s.seed;document.querySelector('#runstatus').textContent=s.running?'running':'paused';if(s.running&&!timer)timer=setInterval(()=>api('/api/step',{}).then(render),Math.max(50,1000/s.speed));if(!s.running&&timer){clearInterval(timer);timer=null}
const systems=document.querySelector('#systems');systems.innerHTML=Object.entries(s.systems).map(([name,x])=>`<article class="panel system"><h2>${name}<span class="badge">${x.action}</span></h2><div class="resources">${Object.entries(x.state).map(([k,v])=>`<div class="resource"><div>${k} <b>${v.toFixed(3)}</b></div><div class="bar"><i style="width:${v*100}%"></i></div></div>`).join('')}</div><div class="kv"><span>maintenance priority</span><b>${x.parameters.maintenance_priority.toFixed(2)}</b></div><div class="kv"><span>contracts</span><b>${x.contracts_confirmed} confirmed · ${x.contracts_refuted} refuted</b></div><div style="margin-top:10px"><select onchange="if(this.value)perturb('${name}',this.value);this.selectedIndex=0"><option value="">Inject probe…</option><option>NO_OP</option><option>MEMORY_ACCESS_REDUCTION</option><option>POLICY_BIAS_INJECTION</option><option>MODEL_TARGET_DRIFT</option></select></div></article>`).join('');
const m=s.systems['monad-0'];document.querySelector('#hypotheses').innerHTML=(m.hypotheses.length?m.hypotheses.map(h=>`<div class="item"><b>${h.hypothesis_id}</b> · ${h.claim}<br><span class="muted">confidence ${h.confidence} · predicted ${h.predicted} · actual ${h.actual}</span></div>`).join(''):'<span class="muted">No hypotheses yet. Step into a mismatch.</span>');document.querySelector('#graph').textContent=JSON.stringify(m.graph,null,2);document.querySelector('#contracts').innerHTML=Object.entries(s.systems).map(([n,x])=>x.pending_contract?`<div class="item"><b>${n}</b> · ${x.pending_contract.target_parameter} → ${x.pending_contract.proposed_value}<br><button onclick="contract('${n}','approve')">Approve</button> <button onclick="contract('${n}','modify')">Modify</button> <button onclick="contract('${n}','reject')">Reject</button></div>`:'').join('')||'<span class="muted">No pending contracts.</span>'}
api('/api/state').then(render);loadArchives();
</script></body></html>
