# dnsmasq config for the LAN split-horizon DNS override.
# Answers cameronlampley.com with this machine's own LAN IP so LAN clients
# connect directly (no NAT hairpin) and Caddy's remote_ip branch in
# scripts/Caddyfile can correctly route them to the console. Every other
# query is forwarded upstream untouched. No DHCP range is configured here
# -- this must never become a second DHCP server on the network.
interface=wlp2s0
bind-interfaces
port=53
user=dnsmasq
group=nogroup
no-resolv
no-hosts
address=/cameronlampley.com/192.168.0.100
server=1.1.1.1
server=8.8.8.8
cache-size=1000
log-queries
