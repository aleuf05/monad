<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admiral's Console — Monad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root {
    --bg: #0B1220;
    --panel: #111A2B;
    --border: #1E2C42;
    --text: #DCE6F2;
    --muted: #6B7C93;
    --accent: #4FD1C5;
    --amber: #E8A33D;
    --red: #E05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; line-height: 1.5; min-height: 100vh; }
  button, textarea, input, select { font: inherit; }
  .muted { color: var(--muted); }
  .small { font-size: 11.5px; }

  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .ship-mark { font-family: 'Oswald', sans-serif; letter-spacing: 0.1em; color: var(--amber); font-size: 15px; }
  .ship-mark a { color: inherit; text-decoration: none; }
  .badge { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; }
  .ghost-btn { margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 11.5px; }
  .ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ghost-btn.small { margin: 6px 0 0; padding: 5px 9px; font-size: 10.5px; }
  .exit-link { background: transparent; border: 1px solid var(--border); color: var(--muted); text-decoration: none; border-radius: 6px; padding: 7px 12px; font-size: 11.5px; }
  .exit-link:hover { border-color: var(--text); color: var(--text); }

  .layout { flex: 1; display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
  @media (min-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } }

  .conversation { display: flex; flex-direction: column; gap: 10px; min-height: 60vh; }
  .transcript { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px; max-height: 65vh; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #05201D; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg.system { align-self: center; color: var(--muted); font-size: 11px; border: 1px dashed var(--border); background: transparent; }

  .image-card { padding: 8px; max-width: 320px; }
  .image-card img { display: block; width: 100%; border-radius: 6px; }
  .image-loading { display: flex; align-items: center; gap: 8px; padding: 10px 4px; color: var(--muted); font-size: 12px; }
  .image-spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--amber); animation: image-spin 0.8s linear infinite; flex: none; }
  @keyframes image-spin { to { transform: rotate(360deg); } }
  .image-failed { padding: 10px 4px; color: var(--red); font-size: 12px; }

  .composer { display: flex; gap: 8px; }
  .composer textarea { flex: 1; resize: vertical; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; }
  .composer button { background: var(--amber); color: #241704; border: none; border-radius: 8px; padding: 0 18px; font-weight: 700; cursor: pointer; }
  .composer button:disabled { opacity: 0.5; cursor: default; }

  .rail { display: flex; flex-direction: column; gap: 12px; }
  .rail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .rail-card label { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .rail-card select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 7px; border-radius: 6px; }
  .rail-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }

  .harvest-list { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; }
  .harvest-empty { color: var(--muted); font-size: 11px; }
  .harvest-item { border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 11.5px; }
  .harvest-type { display: inline-block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--amber); margin-bottom: 4px; }
  .harvest-title { font-weight: 700; margin-bottom: 2px; }
  .harvest-summary { color: var(--muted); margin-bottom: 6px; }
  .harvest-actions { display: flex; gap: 6px; }
  .harvest-actions button { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 5px; padding: 5px; font-size: 10px; cursor: pointer; }
  .harvest-actions .accept:hover { border-color: var(--accent); color: var(--accent); }
  .harvest-actions .reject:hover { border-color: var(--red); color: var(--red); }

  .brief-btn { background: transparent; border: 1px solid var(--border); color: var(--amber); border-radius: 6px; padding: 7px 12px; cursor: pointer; font-size: 11.5px; }
  .brief-btn:hover { border-color: var(--amber); }
  .brief-overlay { position: fixed; inset: 0; background: #05090fcc; display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; }
  .brief-overlay[hidden] { display: none; }
  .brief-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto; padding: 20px 22px; }
  .brief-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .brief-head h2 { font-family: 'Oswald', sans-serif; letter-spacing: 0.06em; color: var(--amber); font-size: 17px; }
  .brief-close { margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .brief-close:hover { color: var(--text); border-color: var(--text); }
  .brief-stamp { color: var(--muted); font-size: 10.5px; margin-bottom: 16px; }
  .brief-section { margin-bottom: 16px; }
  .brief-section h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
  .brief-section p { font-size: 13px; }
  .brief-section ul { padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
  .brief-section li { font-size: 12.5px; }
  .brief-empty { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <span class="ship-mark"><a href="/">⚓ Admiral's Console</a></span>
    <span id="providerBadge" class="badge"></span>
    <button id="briefBtn" class="brief-btn" type="button">📋 Captain's Brief</button>
    <button id="closeSessionBtn" class="ghost-btn">Close &amp; brief session</button>
    <a class="exit-link" href="https://cameronlampley.com/">Public site →</a>
  </header>

  <main class="layout">
    <section class="conversation">
      <div id="transcript" class="transcript" aria-live="polite"></div>
      <form id="chatForm" class="composer">
        <textarea id="chatInput" placeholder="Speak with the Captain… (Enter to send, Shift+Enter for a new line)" rows="2" required></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </form>
    </section>

    <aside class="rail">
      <div class="rail-card">
        <label for="modeSelect">Mode</label>
        <select id="modeSelect">
          <option value="master">Master</option>
          <option value="project_formation">Project Formation</option>
          <option value="design">Design</option>
          <option value="review">Review</option>
          <option value="associative_lab">Associative Lab</option>
          <option value="record">Record</option>
        </select>
      </div>

      <div class="rail-card">
        <label for="projectSelect">Active project</label>
        <select id="projectSelect">
          <option value="">— none —</option>
        </select>
        <button id="newProjectBtn" class="ghost-btn small" type="button">+ New project</button>
        <p id="projectPurpose" class="muted small"></p>
        <p id="projectNextAction" class="muted small"></p>
      </div>

      <div class="rail-card">
        <div class="rail-title">Last session brief</div>
        <p id="lastBrief" class="muted small">None yet.</p>
      </div>

      <div class="rail-card harvest-tray">
        <div class="rail-title">Harvest Tray</div>
        <div id="harvestTray" class="harvest-list"></div>
      </div>
    </aside>
  </main>
</div>

<div id="briefOverlay" class="brief-overlay" hidden>
  <div id="briefCard" class="brief-card" role="dialog" aria-label="Captain's Brief">
    <div class="brief-head">
      <h2>⚓ Captain's Brief</h2>
      <button id="briefCloseBtn" class="brief-close" type="button">Close ✕</button>
    </div>
    <p id="briefStamp" class="brief-stamp"></p>
    <div id="briefBody">
      <p class="brief-empty">Loading…</p>
    </div>
  </div>
</div>

<script src="assets/js/chat-captain.js"></script>
</body>
</html>
